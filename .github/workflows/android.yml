name: Build Turrini Realistic Android
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.22.1

      - name: Clone Bullet
        run: git clone https://github.com/bulletphysics/bullet3.git --depth 1

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turrini-Realistic-v6
          path: app/build/outputs/apk/debug/*.apk
